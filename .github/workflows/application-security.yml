name: Application security checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security/hardening-baseline]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Preserve generated lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brewbudget-package-lock
          path: package-lock.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
